name: Master Command Center Uplink

on:
  schedule:
    - cron: "0 */12 * * *" # Every 12 hours
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # 1. Generate Snake Animation
      - name: Generate Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # 2. Generate 3D Contribution Calendar (Verified)
      - name: Generate 3D Contribution Calendar
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      # 3. Generate GitHub Metrics
      - name: Generate Metrics SVG
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: MudithaMethsara
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: UTC
          config_order: base.header, isocalendar, languages, base.activity, community
          
          # Themes
          config_padding: 6%, 10%
          extras_css: |
            :root {
              --color-canvas-default: #0D1117 !important;
              --color-canvas-subtle: #1e2327 !important;
              --color-fg-default: #ffffff !important;
              --color-fg-muted: #8b949e !important;
              --color-accent-fg: #DC143C !important;
              --color-border-default: #30363d !important;
            }
            .header, .field, .plugin-title { color: #DC143C !important; }
            svg { background: #0D1117 !important; border: 1px solid #DC143C; border-radius: 6px; }
          
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_stars: yes
          plugin_stars_limit: 4
          
          # Output
          filename: metrics.svg
          output_action: none

      # 4. Prepare and Push to 'output' branch
      - name: Prepare Assets for Deployment
        run: |
          mkdir -p deploy
          cp dist/github-snake*.svg deploy/ || true
          cp metrics.svg deploy/ || true
          cp profile-3d-contrib/*.svg deploy/ || true
      
      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: deploy
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
