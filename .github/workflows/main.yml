# ==============================================================================
# GitHub Actions Workflow: Automated Profile Updater & Contribution Snake
# Runs twice daily at 6:00 AM and 6:00 PM Sri Lanka Time (00:30 & 12:30 UTC)
#
# Pipeline Components:
# 1. Dynamic Banner Metrics (generate_svg.py)
# 2. 3D Isometric Contribution Calendar & Streaks (generate_3d_contrib.py)
# 3. Animated Contribution Snake (Platane/snk)
# ==============================================================================

name: Update Profile Metrics, 3D Graph & Snake

on:
  # Run automatically at 6:00 AM and 6:00 PM Sri Lanka Time (Asia/Colombo UTC+5:30 -> 00:30 & 12:30 UTC)
  schedule:
    - cron: "30 0,12 * * *"

  # Allows manual execution from the Actions tab anytime
  workflow_dispatch:

  # Runs on every push to the default branch
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    name: Update Dynamic Metrics, 3D Calendar and Snake
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Step 1: Checkout repository files
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Step 3: Regenerate header.svg and isometric-contributions.svg
      - name: Update Dynamic SVGs
        run: |
          python generate_svg.py
          python generate_3d_contrib.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TZ: "Asia/Colombo"

      # Step 4: Commit updated SVGs if changed
      - name: Commit Updated SVGs
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add assets/header.svg assets/isometric-contributions.svg
          git diff-index --quiet HEAD || git commit -m "chore(auto): update dynamic banner metrics & 3D contribution graph [skip ci]"
          git push origin HEAD:main || git push origin HEAD:master || echo "No updates to push"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 5: Generate the snake SVGs using Platane/snk matching brand palette
      - name: Generate Contribution Grid Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#83CA16&color_dots=#EBEDF0,#D8F89D,#83CA16,#10B981,#165E3E
            dist/github-contribution-grid-snake-dark.svg?color_snake=#83CA16&color_dots=#161B22,#D8F89D,#83CA16,#34D399,#10B981
            dist/github-contribution-grid-snake.gif?color_snake=#83CA16&color_dots=#161B22,#D8F89D,#83CA16,#34D399,#10B981

      # Step 6: Deploy the generated SVGs to the 'output' branch
      - name: Deploy to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
