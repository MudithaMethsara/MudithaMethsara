# ==============================================================================
# GitHub Actions Workflow: Contribution Grid Snake Generator
# Generates an animated SVG eating the GitHub contribution grid
# Styled with the brand color palette extracted from methsara.dev
# ==============================================================================

name: Generate Contribution Snake Animation

on:
  # Run automatically every 12 hours
  schedule:
    - cron: "0 */12 * * *"

  # Allows manual execution from the Actions tab
  workflow_dispatch:

  # Runs on every push to the default branch
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    name: Generate Snake SVGs
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Step 1: Checkout repository files
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Generate the snake SVGs using Platane/snk
      # Color palette configuration:
      # - Light mode palette:
      #     Background: #F7F7F8 (Site background)
      #     Level 1:    #D8F89D (Light lime accent)
      #     Level 2:    #83CA16 (Brand primary lime)
      #     Level 3:    #10B981 (Emerald green)
      #     Level 4:    #121218 (Dark charcoal obsidian)
      # - Dark mode palette:
      #     Background: #121218 (Dark charcoal)
      #     Level 1:    #1E293B (Deep slate)
      #     Level 2:    #83CA16 (Brand primary lime)
      #     Level 3:    #34D399 (Bright mint emerald)
      #     Level 4:    #D8F89D (Vibrant light lime)
      - name: Generate Contribution Grid Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#83CA16&color_dots=#F7F7F8,#D8F89D,#83CA16,#10B981,#121218
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#83CA16&color_dots=#121218,#1E293B,#83CA16,#34D399,#D8F89D
            dist/github-contribution-grid-snake.gif?color_snake=#83CA16&color_dots=#F7F7F8,#D8F89D,#83CA16,#10B981,#121218

      # Step 3: Deploy the generated SVGs to the 'output' branch
      - name: Deploy to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
