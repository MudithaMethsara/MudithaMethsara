<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #F7F7F8; stroke: #E0E2E6; stroke-width: 1.5; rx: 16px; }
      .grid-dot { fill: #E0E2E6; opacity: 0.7; }
      .status-pill { fill: #FFFFFF; stroke: #E0E2E6; stroke-width: 1; rx: 12px; }
      .status-dot { fill: #83CA16; }
      .status-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Instrument Sans', Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #44454C; letter-spacing: 0.6px; text-transform: uppercase; }
      .title-name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Instrument Sans', Roboto, sans-serif; font-size: 28px; font-weight: 700; fill: #121218; letter-spacing: -0.5px; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Instrument Sans', Roboto, sans-serif; font-size: 14.5px; font-weight: 600; fill: #83CA16; letter-spacing: 0.2px; }
      .tagline { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Instrument Sans', Roboto, sans-serif; font-size: 13px; font-weight: 400; fill: #555861; }
      .tag-pill { fill: #FFFFFF; stroke: #E0E2E6; stroke-width: 1; rx: 6px; }
      .tag-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Instrument Sans', Roboto, sans-serif; font-size: 11.5px; font-weight: 500; fill: #121218; }
      .accent-line { stroke: #83CA16; stroke-width: 2; stroke-linecap: round; }
    </style>
    <pattern id="dotPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" class="grid-dot" />
    </pattern>
  </defs>

  <!-- Background Card -->
  <rect x="2" y="2" width="846" height="236" class="bg" />
  
  <!-- Subtle Background Dot Pattern on Right Side -->
  <rect x="520" y="4" width="324" height="232" fill="url(#dotPattern)" rx="14" opacity="0.6" />

  <!-- Status Indicator Pill -->
  <g transform="translate(40, 32)">
    <rect width="180" height="26" class="status-pill" />
    <circle cx="16" cy="13" r="4.5" class="status-dot">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <text x="30" y="17" class="status-text">Available for Projects</text>
  </g>

  <!-- Name & Heading -->
  <text x="40" y="94" class="title-name">Muditha Methsara Kosgollawaththa</text>

  <!-- Subtitle with Accent Color -->
  <text x="40" y="122" class="subtitle">Professional Developer &amp; Software Engineer</text>
  <line x1="340" y1="117" x2="365" y2="117" class="accent-line" />

  <!-- Description / Meta Tagline -->
  <text x="40" y="152" class="tagline">Building scalable web applications, APIs, and digital systems shaped by solid architecture,</text>
  <text x="40" y="172" class="tagline">clean code, and thoughtful execution.</text>

  <!-- Core Competency Tags -->
  <g transform="translate(40, 192)">
    <!-- Tag 1 -->
    <g transform="translate(0, 0)">
      <rect width="66" height="24" class="tag-pill" />
      <text x="33" y="16" text-anchor="middle" class="tag-text">React</text>
    </g>
    <!-- Tag 2 -->
    <g transform="translate(74, 0)">
      <rect width="94" height="24" class="tag-pill" />
      <text x="47" y="16" text-anchor="middle" class="tag-text">TypeScript</text>
    </g>
    <!-- Tag 3 -->
    <g transform="translate(176, 0)">
      <rect width="78" height="24" class="tag-pill" />
      <text x="39" y="16" text-anchor="middle" class="tag-text">Node.js</text>
    </g>
    <!-- Tag 4 -->
    <g transform="translate(262, 0)">
      <rect width="102" height="24" class="tag-pill" />
      <text x="51" y="16" text-anchor="middle" class="tag-text">Spring Boot</text>
    </g>
    <!-- Tag 5 -->
    <g transform="translate(372, 0)">
      <rect width="62" height="24" class="tag-pill" />
      <text x="31" y="16" text-anchor="middle" class="tag-text">Java</text>
    </g>
    <!-- Tag 6 -->
    <g transform="translate(442, 0)">
      <rect width="144" height="24" class="tag-pill" />
      <text x="72" y="16" text-anchor="middle" class="tag-text">Cloud Architecture</text>
    </g>
    <!-- Tag 7 -->
    <g transform="translate(594, 0)">
      <rect width="90" height="24" class="tag-pill" />
      <text x="45" y="16" text-anchor="middle" class="tag-text">REST APIs</text>
    </g>
  </g>
</svg>
